jobs:
  terraform-ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.4.6

    - name: Terraform Format Check
      run: terraform fmt -check

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Security Scan
      run: |
        curl -L $(curl -s https://api.github.com/repos/tfsec/tfsec/releases/latest | jq -r ".assets[] | select(.name | endswith(\"linux_amd64\")) | .browser_download_url") -o tfsec
        chmod +x tfsec
        ./tfsec .

    - name: Lint Terraform Code
      run: |
        curl -L $(curl -s https://api.github.com/repos/terraform-linters/tflint/releases/latest | jq -r ".assets[] | select(.name | endswith(\"linux_amd64.zip\")) | .browser_download_url") -o tflint.zip
        unzip tflint.zip -d tflint
        chmod +x tflint/tflint
        ./tflint/tflint --config=./.tflint.hcl

    - name: Terraform Plan
      run: terraform plan -out=plan.out

    - name: Upload Plan Output
      uses: actions/upload-artifact@v3
      with:
        name: terraform-plan
        path: plan.out
